[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reasona-ai"
version = "0.1.0"
description = "Psychology-informed preparation and reflection for better customer conversations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Reasona AI contributors" },
]
dependencies = [
  "azure-ai-projects>=2.3.0,<3.0",
  "azure-identity>=1.19.0,<2.0",
  "fastapi>=0.115.0,<1.0",
  "jinja2>=3.1.5,<4.0",
  "openai>=1.75.0,<3.0",
  "pydantic-settings>=2.7.0,<3.0",
  "python-dotenv>=1.0.1,<2.0",
  "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0",
  "mypy>=1.14.0,<2.0",
  "pytest>=8.3.0,<9.0",
  "pytest-cov>=6.0.0,<8.0",
  "ruff>=0.9.0,<1.0",
]

[project.scripts]
reasona = "reasona_app.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasona_app = [
  "py.typed",
  "static/*.css",
  "static/*.js",
  "templates/*.html",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reasona_app"]
